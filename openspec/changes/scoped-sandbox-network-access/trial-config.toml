"data.sec.gov" = "allow"
"disclosures-clerk.house.gov" = "allow"
"efts.sec.gov" = "allow"
"en.wikipedia.org" = "allow"
"fc.yahoo.com" = "allow"
"finance.yahoo.com" = "allow"
"gamma-api.polymarket.com" = "allow"
